syntax = "proto3";
package akash.sink.v1;

import "gogoproto/gogo.proto";
import "akash/sink/v1/params.proto";
import "akash/sink/v1/types.proto";

option go_package = "pkg.akt.dev/go/node/sink/v1";

message GenesisRecord {
  ID id = 1;

  RecordData data = 2 [
    (gogoproto.nullable) = false,
    (gogoproto.jsontag) = "data",
    (gogoproto.moretags) = "yaml:\"data\""
  ];

  SettlementData settlement = 3 [
    (gogoproto.nullable) = false,
    (gogoproto.jsontag) = "settlement",
    (gogoproto.moretags) = "yaml:\"settlement\""
  ];

  AccountUsage usage = 4 [
    (gogoproto.nullable) = false,
    (gogoproto.jsontag) = "usage",
    (gogoproto.moretags) = "yaml:\"usage\""
  ];
}

// GenesisState defines the sink module state at genesis or export.
message GenesisState {
  Params params = 1 [
    (gogoproto.nullable) = false,
    (gogoproto.jsontag) = "params",
    (gogoproto.moretags) = "yaml:\"params\""
  ];

  Totals totals = 2 [
    (gogoproto.nullable) = false,
    (gogoproto.jsontag) = "totals",
    (gogoproto.moretags) = "yaml:\"totals\""
  ];

  repeated GenesisRecord records = 3 [
    (gogoproto.jsontag) = "records",
    (gogoproto.moretags) = "yaml:\"records\""
  ];
}
