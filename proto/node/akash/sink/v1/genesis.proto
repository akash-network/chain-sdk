syntax = "proto3";
package akash.sink.v1;

import "gogoproto/gogo.proto";
import "akash/sink/v1/params.proto";
import "akash/sink/v1/types.proto";

option go_package = "pkg.akt.dev/go/node/sink/v1";

// GenesisState defines the sink module state at genesis or export.
message GenesisState {
  reserved 3;
  reserved "launch_reserve_source";

  Params params = 1 [(gogoproto.nullable) = false];
  Totals totals = 2 [(gogoproto.nullable) = false];
  repeated TransferState transfers = 4 [(gogoproto.nullable) = false];
  repeated AccountUsage accounts = 5 [(gogoproto.nullable) = false];
}
