syntax = "proto3";
package akash.sink.v1;

import "gogoproto/gogo.proto";
import "cosmos_proto/cosmos.proto";
import "akash/sink/v1/params.proto";
import "akash/sink/v1/types.proto";

option go_package = "pkg.akt.dev/go/node/sink/v1";

// GenesisAccount preserves one owner's lifetime and raw epoch usage.
message GenesisAccount {
  string owner = 1 [
    (cosmos_proto.scalar) = "cosmos.AddressString",
    (gogoproto.jsontag) = "owner",
    (gogoproto.moretags) = "yaml:\"owner\""
  ];

  AccountUsage usage = 2 [
    (gogoproto.nullable) = false,
    (gogoproto.jsontag) = "usage",
    (gogoproto.moretags) = "yaml:\"usage\""
  ];
}

// GenesisRecord preserves the immutable record and complete canonical settlement key.
message GenesisRecord {
  ID id = 1 [
    (gogoproto.nullable) = false,
    (gogoproto.customname) = "ID",
    (gogoproto.jsontag) = "id",
    (gogoproto.moretags) = "yaml:\"id\""
  ];
  RecordData data = 2 [
    (gogoproto.nullable) = false,
    (gogoproto.jsontag) = "data",
    (gogoproto.moretags) = "yaml:\"data\""
  ];
  SettlementData settlement = 3 [
    (gogoproto.nullable) = false,
    (gogoproto.jsontag) = "settlement",
    (gogoproto.moretags) = "yaml:\"settlement\""
  ];
  reserved 4;
  reserved "usage";
  Status status = 5 [
    (gogoproto.jsontag) = "status",
    (gogoproto.moretags) = "yaml:\"status\""
  ];
}

// GenesisState exports complete sink state; schema_version must be 4 for canonical settlements.
message GenesisState {
  Params params = 1 [
    (gogoproto.nullable) = false,
    (gogoproto.jsontag) = "params",
    (gogoproto.moretags) = "yaml:\"params\""
  ];

  Totals totals = 2 [
    (gogoproto.nullable) = false,
    (gogoproto.jsontag) = "totals",
    (gogoproto.moretags) = "yaml:\"totals\""
  ];

  // Current policy and every additional policy referenced by retained evidence.
  repeated ReporterPolicy policies = 6 [
    (gogoproto.nullable) = false,
    (gogoproto.jsontag) = "policies",
    (gogoproto.moretags) = "yaml:\"policies\""
  ];

  EpochUsage send_usage = 4 [
    (gogoproto.nullable) = false,
    (gogoproto.jsontag) = "send_usage",
    (gogoproto.moretags) = "yaml:\"send_usage\""
  ];

  EpochUsage refund_usage = 5 [
    (gogoproto.nullable) = false,
    (gogoproto.jsontag) = "refund_usage",
    (gogoproto.moretags) = "yaml:\"refund_usage\""
  ];

  repeated GenesisRecord records = 3 [
    (gogoproto.nullable) = false,
    (gogoproto.jsontag) = "records",
    (gogoproto.moretags) = "yaml:\"records\""
  ];

  // One record per owner, including any retained empty usage records.
  repeated GenesisAccount accounts = 7 [
    (gogoproto.nullable) = false,
    (gogoproto.jsontag) = "accounts",
    (gogoproto.moretags) = "yaml:\"accounts\""
  ];

  uint32 schema_version = 8 [
    (gogoproto.jsontag) = "schema_version",
    (gogoproto.moretags) = "yaml:\"schema_version\""
  ];

  uint64 current_policy_version = 9 [
    (gogoproto.jsontag) = "current_policy_version",
    (gogoproto.moretags) = "yaml:\"current_policy_version\""
  ];
}
