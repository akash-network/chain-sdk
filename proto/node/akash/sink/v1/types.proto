syntax = "proto3";
package akash.sink.v1;

import "gogoproto/gogo.proto";

option go_package = "pkg.akt.dev/go/node/sink/v1";

// Totals records escrow accounting and monotonically increasing transfer and reporter identifiers.
message Totals {
  uint64 last_transfer_id = 1;
  uint64 launch_reserve = 2;
  uint64 pending_amount = 3;
  uint64 pending_count = 4;
  uint64 minted_amount = 5;
  uint64 voided_amount = 6;
  uint64 refunded_amount = 7;
  uint64 refund_day = 8;
  uint64 refunded_today = 9;
  uint64 reporter_epoch = 10;
}

// AccountUsage tracks deposit limits for one Akash account.
message AccountUsage {
  bytes sender = 1;
  uint64 day = 2;
  uint32 daily_count = 3;
  uint32 pending_count = 4;
  uint64 daily_amount = 5; // uakt deposited on day.
}

// TransferState combines the immutable 77-byte proof record with mutable settlement state.
message TransferState {
  bytes record = 1;
  bool void_ordered = 2;
  Settlement settlement = 3 [(gogoproto.nullable) = false];
}

// Outcome is the finalized Solana result reported by an observer.
enum Outcome {
  // OUTCOME_UNSPECIFIED represents unspecified.
  OUTCOME_UNSPECIFIED = 0;
  // OUTCOME_MINTED represents minted.
  OUTCOME_MINTED = 1;
  // OUTCOME_VOIDED represents voided.
  OUTCOME_VOIDED = 2;
}

// Status describes settlement and refund payment on Akash.
enum Status {
  // STATUS_PENDING represents pending.
  STATUS_PENDING = 0;
  // STATUS_MINTED represents minted.
  STATUS_MINTED = 1;
  // STATUS_VOIDED represents voided.
  STATUS_VOIDED = 2;
  // STATUS_REFUNDED represents refunded.
  STATUS_REFUNDED = 3;
}

// Hold prevents settlement while a veto or conflicting observation is unresolved.
enum Hold {
  // HOLD_NONE represents none.
  HOLD_NONE = 0;
  // HOLD_VETO represents veto.
  HOLD_VETO = 1;
  // HOLD_CONFLICT represents conflict.
  HOLD_CONFLICT = 2;
}

// Decision specifies the governance action for a held transfer.
enum Decision {
  // DECISION_UNSPECIFIED represents unspecified.
  DECISION_UNSPECIFIED = 0;
  // DECISION_RESTART represents restart.
  DECISION_RESTART = 1;
  // DECISION_CONFIRM_MINT represents confirm mint.
  DECISION_CONFIRM_MINT = 2;
  // DECISION_CONFIRM_VOID represents confirm void.
  DECISION_CONFIRM_VOID = 3;
}

// Observation identifies a finalized Solana mint or void and its evidence.
message Observation {
  Outcome outcome = 1;
  uint64 slot = 2;
  bytes transaction_signature = 3;
}

// Vote records one reporter observation.
message Vote {
  string reporter = 1;
  Observation observation = 2 [(gogoproto.nullable) = false];
}

// ReporterPolicy snapshots the membership and threshold for one epoch.
message ReporterPolicy {
  uint64 epoch = 1;
  repeated string members = 2;
  uint32 threshold = 3;
}

// Settlement tracks reporter votes, holds and the refund challenge window.
message Settlement {
  Status status = 1;
  Hold hold = 2;
  uint64 round = 3;
  ReporterPolicy policy = 4 [(gogoproto.nullable) = false];
  repeated Vote votes = 5 [(gogoproto.nullable) = false];
  int64 challenge_end = 6;
  Observation governance_observation = 7;
  string veto_by = 8;
  string veto_reason = 9;
}
