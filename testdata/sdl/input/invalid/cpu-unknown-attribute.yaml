# arch is the only CPU attribute either SDK accepts.
---
version: "2.0"
services:
  web:
    image: nginx
    expose:
      - port: 80
        to:
          - global: true
profiles:
  compute:
    web:
      resources:
        cpu:
          units: "100m"
          attributes:
            vendor: intel
        memory:
          size: "128Mi"
        storage:
          size: "1Gi"
  placement:
    westcoast:
      pricing:
        web:
          denom: uakt
          amount: 50
deployment:
  web:
    westcoast:
      profile: web
      count: 1
